name: Bug report
description: Report a reproducible Property Rental Manager problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include Torn API keys, cookies, tokens, or private user data."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Userscript version
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
